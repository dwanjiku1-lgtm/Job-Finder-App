<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>JobFinder</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="hero">
            <h1>Job<span>Finder</span></h1>
            <p>Search real job listing from around the world.</p>
            <form id="search-form" class="search">
                <input id="queryInput" type="text" placeholder="e.g. developer in Nairobi" required />
                <input id="country" type="text" placeholder="Country code, e.g. ke" maxlength="2" />
                <button type="submit">Search</button>
            </form>

        </header>
        <main>
            <section class="controls">
                <select id="typefilter" aria-label="Job type">
                    <option value="">All job type</option>
                    <option value="full">Full-time</option>
                    <option value="part">Part-time</option>
                    <option value="contract">Contract</option>
                    <option value="intern">Internship</option>
                </select>

                <select id="sortSelect" aria-label="Sort by">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest-first</option>
                    <option value="company">Company A-Z</option>
                </select>

                <label class="check">
                    <input type="checkbox" id="remoteOnly" /> Remote only
                </label>

                <input id="filterInput" type="text" placeholder="Filter results by keyword.."/>
            </section>
            <p id="status" class="status"></p>
            <section id="results" class="grid"></section>
        </main>

        <p id="server-label"></p>

        <footer>
            Data from <a href="https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch" target="_blank" rel="noopener">JSearch API</a> by Letscrape via RapidAPI.
        </footer>
        <script src="app.js"></script>
    </body>
</html>
